<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h2>Formulário</h2>

    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
    </div>

    <br>
    
    <div>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
   </div>

   <br>

   <div>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telfone" placeholder="(99) 99999-9999">
   </div>
    
   <br>

   <div>
        <label for="linkdin">Linkedin:</label>
        <input type="linkedin" id="linkedin" name="email" required>
   </div>

   <br>

   <div>
        <label for="endereço">Endereço:</label>
        <input type="endereço" id="endereço" name="endereço" required>
    </div>
    
    <br>

    <button type="submit">Enviar Formulário</button>
        
</body>
</html>
